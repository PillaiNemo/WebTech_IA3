<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CivicFix: report civic issues in your locality, track their progress, and help build better, cleaner communities.">
  <meta name="theme-color" content="#1F2328">
  <title>CivicFix</title>

  <!-- Runs before the page paints: marks that JavaScript is on (so reveal
       animations may hide content first) and applies a saved theme and text size. -->
  <script>
    (function () {
      var root = document.documentElement;
      var theme = null, text = null;
      root.classList.add('js');
      try { theme = localStorage.getItem('cf-theme'); text = localStorage.getItem('cf-text'); } catch (e) { theme = null; }
      root.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      root.setAttribute('data-text', text === 'sm' || text === 'lg' ? text : 'md');
    })();
  </script>

  <!-- Off-white from the very first paint, matching the preloader. -->
  <style>body { background: #FBF8F2; margin: 0; }</style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
